<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Trading Agent Frontend</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>RL Trading Agent</h1>
        <p>Demo the sentiment-based trading model predictions.</p>

        <h2>Market & News Data</h2>
        <p>Real data used in model training:</p>
        <button id="dataBtn">Show Market Data</button>

        <div id="dataDisplay" class="result hidden">
            <h3>News Headlines</h3>
            <div id="newsData"></div>

            <h3>Sentiment Analysis</h3>
            <div id="sentimentData"></div>
        </div>

        <h2>Test Model</h2>
        <p>Choose a test scenario or run with sample data:</p>

        <div style="margin-bottom: 10px;">
            <select id="testScenario">
                <option value="">-- Select a test scenario --</option>
                <option value="neutral_market">Neutral Market</option>
                <option value="bullish_market">Bullish Market</option>
                <option value="bearish_market">Bearish Market</option>
                <option value="high_volatility">High Volatility</option>
                <option value="positive_sentiment">Positive Sentiment Only</option>
                <option value="negative_sentiment">Negative Sentiment Only</option>
            </select>
        </div>

        <button id="testBtn">Run Test</button>
        <div id="sampleData"
            style="margin-top: 10px; font-family: monospace; background: #f8f9fa; padding: 10px; border-radius: 4px;">
        </div>

        <div id="result" class="result hidden">
            <h3>Result</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
